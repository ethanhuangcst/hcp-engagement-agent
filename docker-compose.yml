# HCP Engagement Assistant — local / edge stack
# MySQL stays on remote managed instance (DATABASE_URL in .env).
# App images come from GHCR (built by .github/workflows/docker-build.yml).
#
#   cp .env.example .env   # fill DATABASE_URL (+ LLM keys if needed)
#   # If GHCR packages are private:
#   echo $GITHUB_TOKEN | docker login ghcr.io -u USERNAME --password-stdin
#   docker compose pull
#   docker compose up -d
#
# Image tag (default: latest from main):
#   IMAGE_TAG=sha-abc1234 docker compose up -d
#   IMAGE_TAG=1.2.3 docker compose up -d
#
# Ports (host):
#   Web     http://127.0.0.1:3001
#   MCP     http://127.0.0.1:3200/mcp  (health: /health)
#   Qdrant  http://127.0.0.1:6333     (loopback only)

name: hcp-engagement

x-ghcr: &ghcr
  # ethanhuangcst/hcp-engagement-agent — matches GITHUB_REPOSITORY
  pull_policy: always

services:
  qdrant:
    image: qdrant/qdrant:v1.14.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: "6333"

  hcp-twin-mcp:
    <<: *ghcr
    image: ghcr.io/ethanhuangcst/hcp-engagement-agent/hcp-twin-mcp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MCP_TRANSPORT: http
      MCP_PORT: "3200"
      TWIN_MODE: live
      HCA_DATA_DIR: /data
      QDRANT_URL: http://qdrant:6333
      VECTOR_BACKEND: qdrant-local
    volumes:
      - ./data:/data
    ports:
      - "3200:3200"
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3200/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    <<: *ghcr
    image: ghcr.io/ethanhuangcst/hcp-engagement-agent/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
      HCA_DATA_DIR: /data
      # Override host-local URLs from .env for compose network
      MCP_URL: http://hcp-twin-mcp:3200
      QDRANT_URL: http://qdrant:6333
      VECTOR_BACKEND: qdrant-local
    volumes:
      - ./data:/data
    ports:
      - "3001:3001"
    depends_on:
      hcp-twin-mcp:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes: {}
