# HCP Engagement Assistant — local / edge stack
# MySQL stays on remote managed instance (DATABASE_URL in .env).
# App images come from GHCR (built by .github/workflows/docker-build.yml).
#
#   cp .env.example .env   # fill DATABASE_URL (+ LLM keys if needed)
#   # If GHCR packages are private:
#   echo $GITHUB_TOKEN | docker login ghcr.io -u USERNAME --password-stdin
#   docker compose pull
#   docker compose up -d
#
# Image tag (default: latest from main):
#   IMAGE_TAG=sha-abc1234 docker compose up -d
#   IMAGE_TAG=1.2.3 docker compose up -d
#
# Ports (host):
#   Web     http://127.0.0.1:3001
#   MCP     http://127.0.0.1:3200/mcp  (health: /health)
#   MCP2    http://127.0.0.1:3205/mcp  (health: /health, loopback only)
#   Qdrant  http://127.0.0.1:6333     (loopback only)

name: hcp-engagement

x-ghcr: &ghcr
  # ethanhuangcst/hcp-engagement-agent — matches GITHUB_REPOSITORY
  pull_policy: always

services:
  qdrant:
    image: qdrant/qdrant:v1.14.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: "6333"
    networks:
      default:
        aliases:
          # 共享 portainer_network 上存在第二个 "qdrant" 别名（kb-qdrant），Docker DNS 轮询导致
          # 我方服务约半数请求打进 kb 的 Qdrant。专属别名根治；服务名 alias "qdrant" 保留给历史调用方。
          - hcp-qdrant

  hcp-twin-mcp:
    <<: *ghcr
    image: ghcr.io/ethanhuangcst/hcp-engagement-agent/hcp-twin-mcp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - stack.env
    environment:
      MCP_TRANSPORT: http
      MCP_PORT: "3200"
      TWIN_MODE: live
      HCA_DATA_DIR: /data
      QDRANT_URL: http://hcp-qdrant:6333
      # 共享网络专属别名（Docker DNS 防串库）；别名不在 security 白名单，显式放行容器网络内非 loopback
      QDRANT_ALLOW_NON_LOCAL: "true"
      VECTOR_BACKEND: qdrant-local
      # TWIN2-01 定时刷新（不设 = 关闭；空串视为关闭）
      TWIN_REFRESH_CRON: ${TWIN_REFRESH_CRON:-}
    volumes:
      - ./data:/data
    ports:
      - "3200:3200"
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3200/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  hcp-engagement-mcp:
    <<: *ghcr
    image: ghcr.io/ethanhuangcst/hcp-engagement-agent/hcp-engagement-mcp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - stack.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      QDRANT_URL: http://hcp-qdrant:6333
      # 共享网络专属别名（Docker DNS 防串库）；别名不在 security 白名单，显式放行容器网络内非 loopback
      QDRANT_ALLOW_NON_LOCAL: "true"
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen-max}
      VECTOR_BACKEND: qdrant-local
      MCP_TRANSPORT: http
      MCP2_PORT: "3300"
      # 库外消歧经对内 twin-mcp（容器名 DNS，别名唯一）；不设则继承 stack.env 的 127.0.0.1 宿主机口径，容器内不可达
      MCP_URL: http://hcp-twin-mcp:3200
      HCA_DATA_DIR: /data
      RAG_DEBUG: "1"   # 上线排障临时开关（排障完成，保留至 task-02 收口复核后移除）
      # 生产在线拉取 PubMed（原「已知限制」，2026-10-22 转正）
      RAG_ACADEMIC_FETCH: pubmed
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:3205:3300"   # loopback-only（同 qdrant 模式）；3204 已被占用实测改 3205。外部访问留待 NPM/代理 story，不直接对公网开
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3300/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    <<: *ghcr
    image: ghcr.io/ethanhuangcst/hcp-engagement-agent/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - stack.env
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
      HCA_DATA_DIR: /data
      # Override host-local URLs from .env for compose network
      MCP_URL: http://hcp-twin-mcp:3200
      QDRANT_URL: http://hcp-qdrant:6333
      # 共享网络专属别名（Docker DNS 防串库）；别名不在 security 白名单，显式放行容器网络内非 loopback
      QDRANT_ALLOW_NON_LOCAL: "true"
      VECTOR_BACKEND: qdrant-local
    volumes:
      - ./data:/data
    ports:
      - "3001:3001"
    depends_on:
      hcp-twin-mcp:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes: {}


networks:
  default:
    external: true
    name: portainer_network
