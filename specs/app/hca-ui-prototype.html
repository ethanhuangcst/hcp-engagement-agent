      --hca-warn: #8A6A3B;

    .nav button {

      color: var(--hca-ink-muted);
      background: #fafbfc;

    table.data tr:last-child td { border-bottom: none; }

      font-size: 11px;
      font-weight: 500;
      margin: 0 4px 4px 0;

    .bubble.user { align-self: flex-end; background: var(--hca-accent-soft); }

    }

      border-left: 2px solid transparent; color: var(--hca-ink-muted);
    }
    .session-list button.active {
      border-left-color: var(--hca-accent);
      background: var(--hca-accent-soft); color: var(--hca-ink);
    }
    .agent-panel {
      border: 1px solid var(--hca-line); background: #fff;

      resize: both; overflow: auto;

    .agent-panel .head {
      padding: 12px 14px; border-bottom: 1px solid var(--hca-line);
      display: flex; justify-content: space-between; align-items: center;

    }

    .agent-panel textarea { flex: 1; min-height: 56px; resize: vertical; }

    .hidden { display: none !important; }
    .fade-in { animation: fadeIn 0.35s ease both; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .fade-in { animation: none; }
    }
  </style>
</head>

  function activeTwin() {
    return twins.find((t) => t.id === state.activeTwinId) || twins[0];
  }

  function showHcpTabs() {
    // 有当前 HCP 即可进洞察/一人一策（原型评审：四 Tab 始终可见可点）
    return Boolean(state.activeTwinId && twins.some((t) => t.id === state.activeTwinId));

  function tierClass(t) {
    return t === "T1" ? "t1" : t === "T2" ? "t2" : "t3";
  }

  function roleClass(r) {
    return r === "行政" || r === "政策发声" ? "warn" : r === "KOL" ? "t2" : "soft";
  }

  function tagsHtml(tier, roles) {
    const rs = (roles || []).slice(0, 3);
    return `<span class="tag ${tierClass(tier)}">${tier}</span>` +
      rs.map((r) => `<span class="tag ${roleClass(r)}">${r}</span>`).join("");
  }

  function idsHtml(ids) {
    const rows = [
      ["ORCID", ids.orcid],
      ["PubMed Author", ids.pubmed_author],
      ["Google Scholar", ids.google_scholar],
      ["OpenAlex", ids.openalex],
      ["Scopus", ids.scopus_author_id],
      ["CNKI", ids.cnki_scholar],
    ];
    return `<table class="ids-table">${rows.map(([k, v]) =>
      `<tr><td>${k}</td><td class="mono">${v || "待绑定"}</td></tr>`).join("")}</table>`;

  function updateSpecimen() {
    const t = activeTwin();
    const show =
      state.page === "insights" ||
      state.page === "options" ||
      state.page === "agent" ||
      (state.page === "twin" && (state.twinView === "detail" || state.twinView === "list"));
    document.getElementById("specimenAbbr").textContent = show && t ? t.abbrev : "—";
    const dot = document.getElementById("specimenDot");
    dot.className = "dot" + (t ? " high" : "");
  }

  function renderNav() {
    const gate = showHcpTabs();
    navEl.innerHTML = NAV.map((n) => {
      const needGate = n.id === "insights" || n.id === "options";
      const locked = needGate && !gate;
      const active = state.page === n.id;
      const title = locked ? "请先在数字分身中选定一位 HCP" : "";
      // 四 Tab 始终渲染；未选 HCP 时洞察/一人一策加 locked 样式但仍显示
      return `<button type="button" data-page="${n.id}" class="${[active ? "active" : "", locked ? "locked" : ""].filter(Boolean).join(" ")}" title="${title}">${n.label}</button>`;
    }).join("");
  }

  function goPage(id) {
    if ((id === "insights" || id === "options") && !showHcpTabs()) {
      alert("请先在「数字分身」列表中打开或选定一位 HCP。");
      return;
    }
    state.page = id;
    if (id === "insights" || id === "options") {
      state.twinView = "detail";
    }
    if (id === "twin") {
      state.twinView = "list";
    }
    render();
  }

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    })[c]);
  }

  function render() {
    renderNav();
    updateSpecimen();
    const content = document.getElementById("root");
    content.classList.toggle("wide", state.page === "agent");
    let html = "";
    if (state.page === "twin") {
      if (state.twinView === "list") html = renderList();
      else if (state.twinView === "create") html = renderCreate();
      else if (state.twinView === "candidates") html = renderCandidates();
      else if (state.twinView === "confirm") html = renderProfile("confirm");
      else if (state.twinView === "detail") html = renderProfile("detail");
      else if (state.twinView === "edit") html = renderEdit();
    } else if (state.page === "insights") html = renderInsights();
    else if (state.page === "options") html = renderOptions();
    else if (state.page === "agent") html = renderAgent();
    content.innerHTML = html;
    content.classList.remove("fade-in");
    void content.offsetWidth;
    content.classList.add("fade-in");
  }

  document.body.addEventListener("click", (e) => {
    const navBtn = e.target.closest("[data-page]");
    if (navBtn && navBtn.dataset.page) {
      goPage(navBtn.dataset.page);
      return;
    }
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const a = el.dataset.action;
    if (a === "create") {
      state.twinView = "create";
      state.form = { name: "朱同玉", hospital: "复旦大学附属中山医院", dept: "肾脏移植科 / 泌尿外科" };
      render();
    } else if (a === "to-list") {
      state.twinView = "list";
      state.page = "twin";
      render();
    } else if (a === "to-create") {
      state.twinView = "create";
      render();
    } else if (a === "to-candidates") {
      state.twinView = "candidates";
      render();
    } else if (a === "query") {
      state.form = {
        name: document.getElementById("f-name").value.trim(),
        hospital: document.getElementById("f-hospital").value.trim(),
        dept: document.getElementById("f-dept").value.trim(),
      };
      state.candidates = mockSearch(state.form.name, state.form.hospital, state.form.dept);
      state.twinView = "candidates";
      render();
    } else if (a === "pick") {
      const c = state.candidates.find((x) => x.candidateId === el.dataset.cid);
      state.selectedCandidate = c;
      state.twinView = "confirm";
      render();
    } else if (a === "save") {
      const t = candidateToTwin(state.selectedCandidate);
      twins = [t, ...twins.filter((x) => x.id !== t.id)];
      state.activeTwinId = t.id;
      state.twinView = "detail";
      render();
    } else if (a === "open") {
      state.activeTwinId = el.dataset.id;
      state.twinView = "detail";
      state.page = "twin";
      render();
    } else if (a === "edit") {
      state.activeTwinId = el.dataset.id || state.activeTwinId;
      state.twinView = "edit";
      state.page = "twin";
      render();
    } else if (a === "save-edit") {
      const t = activeTwin();
      t.name = document.getElementById("e-name").value.trim();
      t.hospital = document.getElementById("e-hospital").value.trim();
      t.dept = document.getElementById("e-dept").value.trim();
      t.abbrev = t.name.slice(0, 1);
      state.twinView = "detail";
      render();
    } else if (a === "del") {
      if (!confirm("确认删除该分身？")) return;
      const id = el.dataset.id;
      twins = twins.filter((x) => x.id !== id);
      if (state.activeTwinId === id) {
        state.activeTwinId = twins[0]?.id || "";
        state.twinView = "list";
      }
      render();
    } else if (a === "opt") {
      state.optionId = el.dataset.oid;
      render();
    } else if (a === "gen-opt") {
      alert("（原型）已生成方案。正式环境调用 hcp-engagement-agent proposeOptions。");
    } else if (a === "gate") {
      alert("（原型）合规闸门：附条件通过。正式环境调用 runComplianceGate / cn-hcp-compliance。");
    } else if (a === "opt-send") {
      const input = document.getElementById("opt-input");
      const text = (input?.value || "").trim();
      if (!text) return;
      state.optionChat.push({ role: "user", text });
      state.optionChat.push({ role: "bot", text: "（原型）已记录。完整对话请使用「HCP Engagement Agent」Tab。" });
      render();
    } else if (a === "session") {
      state.sessionId = el.dataset.sid;
      render();
    } else if (a === "new-session") {
      const id = "s" + Date.now();
      state.sessions.unshift({ id, title: "新建对话", messages: [{ role: "bot", text: "新会话已创建。" }] });
      state.sessionId = id;
      state.attachments = [];
      render();
    } else if (a === "upload") {
      state.attachments.push("附件-" + (state.attachments.length + 1) + ".pdf");
      render();
    } else if (a === "agent-send") {
      const input = document.getElementById("agent-input");
      const text = (input?.value || "").trim();
      if (!text) return;
      const s = state.sessions.find((x) => x.id === state.sessionId);
      s.messages.push({ role: "user", text });
      s.messages.push({ role: "bot", text: "（原型回复）已收到。正式环境将调用 hcp-engagement-agent（mode=open_chat）。" });
      state.agentInput = "";
      render();
    }
  });

  render();
})();
  </script>
</body>
</html>
